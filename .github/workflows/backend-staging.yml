name: Backend Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend checks
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          SECRET_KEY: test-secret-for-ci
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m ruff check app
          python -m pytest

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x "*.egg-info/*"

      - name: Deploy to Azure App Service
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile does not contain ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          publish_url = profile.attrib["publishUrl"].strip()
          if not publish_url.startswith(("http://", "https://")):
              publish_url = f"https://{publish_url}"
          publish_url = publish_url.rstrip("/")
          if not publish_url.endswith("/api/zipdeploy"):
              publish_url = f"{publish_url}/api/zipdeploy"

          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          subprocess.run(
              [
                  "curl",
                  "--fail",
                  "--show-error",
                  "--location",
                  "--request",
                  "POST",
                  "--user",
                  f"{username}:{password}",
                  "--header",
                  "Content-Type: application/zip",
                  "--data-binary",
                  "@backend-release.zip",
                  publish_url,
              ],
              check=True,
          )
          PY
