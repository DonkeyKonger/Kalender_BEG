name: Diagnose Azure staging API startup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-staging-api-startup.yml"
  workflow_dispatch:

jobs:
  collect-startup-logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Read Azure and Kudu startup logs
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile contains no ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          credentials = base64.b64encode(f"{username}:{password}".encode()).decode()
          publish_url = profile.attrib["publishUrl"].strip()
          if not publish_url.startswith(("http://", "https://")):
              publish_url = f"https://{publish_url}"
          parsed = urllib.parse.urlsplit(publish_url)
          scm_base = urllib.parse.urlunsplit((parsed.scheme, parsed.netloc, "", "", "")).rstrip("/")

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Basic {credentials}"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          def print_log(title, content):
              decoded = content.decode("utf-8", errors="replace")
              print(f"\n===== {title} =====")
              print(decoded[-100_000:])

          def print_relevant_log(title, content):
              lines = content.decode("utf-8", errors="replace").splitlines()
              markers = (
                  "werkzeug",
                  "traceback",
                  "exception",
                  "unresolved",
                  "ambiguous",
                  "blocker",
                  "startup.sh",
                  "gunicorn",
                  "alembic",
              )
              matching = {
                  index
                  for index, line in enumerate(lines)
                  if any(marker in line.casefold() for marker in markers)
              }
              context = sorted(
                  {
                      nearby
                      for index in matching
                      for nearby in range(max(0, index - 3), min(len(lines), index + 4))
                  }
              )
              print(f"\n===== {title} (relevante Zeilen) =====")
              if not context:
                  print("<keine passenden Anwendungszeilen>")
                  return
              previous = None
              for index in context[-500:]:
                  if previous is not None and index > previous + 1:
                      print("...")
                  print(lines[index])
                  previous = index

          failures = []
          try:
              docker_payload = fetch(f"{scm_base}/api/logs/docker")
              print_log("Kudu /api/logs/docker", docker_payload)
              entries = json.loads(docker_payload)
              if isinstance(entries, list):
                  for entry in entries[-10:]:
                      href = entry.get("href") if isinstance(entry, dict) else None
                      if not href:
                          continue
                      try:
                          print_relevant_log(f"Containerlog {href}", fetch(href))
                      except Exception as error:
                          failures.append(f"{href}: {error}")
          except Exception as error:
              failures.append(f"/api/logs/docker: {error}")

          try:
              print_log(
                  "Kudu /api/vfs/LogFiles/",
                  fetch(f"{scm_base}/api/vfs/LogFiles/"),
              )
          except Exception as error:
              failures.append(f"/api/vfs/LogFiles/: {error}")

          try:
              startup_payload = fetch(f"{scm_base}/api/vfs/LogFiles/StartupLogs/")
              print_log("Kudu StartupLogs-Verzeichnis", startup_payload)
              startup_entries = json.loads(startup_payload)
              if isinstance(startup_entries, list):
                  for entry in startup_entries[-20:]:
                      href = entry.get("href") if isinstance(entry, dict) else None
                      if not href:
                          continue
                      try:
                          print_relevant_log(f"StartupLog {href}", fetch(href))
                      except Exception as error:
                          failures.append(f"{href}: {error}")
          except Exception as error:
              failures.append(f"/api/vfs/LogFiles/StartupLogs/: {error}")

          if failures:
              print("\n===== Nicht lesbare Diagnosequellen =====")
              print("\n".join(failures))
          PY
