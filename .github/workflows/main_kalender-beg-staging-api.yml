name: Build and deploy Python app to Azure Web App - staging API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  workflow_dispatch:

concurrency:
  group: backend-staging-api-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tool_source_sha256: ${{ steps.verify-tool-import.outputs.source_sha256 }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          SECRET_KEY: test-secret-for-ci
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m pip install --upgrade pip
          python -m app.scripts.check_runtime_dependencies
          python -m pip install -r requirements.txt
          python -c "from app.main import app; assert app.title == 'Baustellenplaner API'"
          python -m pip install -e ".[dev]"
          python -m ruff check app
          python -m pytest

      - name: Create deployment package
        run: |
          printf '%s\n' "$GITHUB_SHA" > backend/app/build_sha.txt
          cd backend
          zip -r ../backend-release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x "*.egg-info/*"

      - name: Verify tool import files in deployment package
        id: verify-tool-import
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          required_files = {
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx",
              "app/scripts/import_bundled_tools.py",
              "startup.sh",
          }
          with ZipFile("backend-release.zip") as archive:
              packaged_files = set(archive.namelist())
              missing = sorted(required_files - packaged_files)
              if missing:
                  raise SystemExit(
                      "Deployment-Paket enthält nicht alle Importdateien: "
                      + ", ".join(missing)
                  )
              with TemporaryDirectory() as temporary_directory:
                  app_root = Path(temporary_directory).resolve()
                  archive.extractall(app_root)
                  completed = subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "app.scripts.import_bundled_tools",
                          "--check-only",
                      ],
                      cwd=app_root,
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  verification = json.loads(completed.stdout)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_sha256={verification['sha256']}\n")
          print(json.dumps(verification, ensure_ascii=False, sort_keys=True))
          print(
              "Werkzeug-Importdatei liegt im Deployment-Paket unter "
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx und wird "
              "vom extrahierten App-Root gefunden."
          )
          PY

      - name: Upload artifact for deployment jobs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend-release.zip

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Prepare deployment guard
        run: python -m zipfile -e backend-release.zip deployment-source

      - name: Capture current deployment for rollback
        id: previous_deployment
        working-directory: deployment-source
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: python -m app.scripts.azure_deploy_guard capture

      - name: Deploy to Azure Web App
        id: deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile does not contain ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          publish_url = profile.attrib["publishUrl"].strip()
          if not publish_url.startswith(("http://", "https://")):
              publish_url = f"https://{publish_url}"
          publish_url = publish_url.rstrip("/")
          if not publish_url.endswith("/api/zipdeploy"):
              publish_url = f"{publish_url}/api/zipdeploy"

          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          subprocess.run(
              [
                  "curl",
                  "--fail",
                  "--show-error",
                  "--location",
                  "--request",
                  "POST",
                  "--user",
                  f"{username}:{password}",
                  "--header",
                  "Content-Type: application/zip",
                  "--data-binary",
                  "@backend-release.zip",
                  publish_url,
              ],
              check=True,
          )
          PY

      - name: Verify deployed application
        working-directory: deployment-source
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python -m app.scripts.azure_deploy_guard verify \
            --expected-revision "${{ github.sha }}" \
            --expected-tool-source-sha256 "${{ needs.build.outputs.tool_source_sha256 }}"

      - name: Restore previous deployment after failed verification
        if: >-
          ${{ failure() && steps.deploy.outcome == 'success' &&
              steps.previous_deployment.outputs.deployment_id != '' }}
        working-directory: deployment-source
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python -m app.scripts.azure_deploy_guard rollback \
            --deployment-id "${{ steps.previous_deployment.outputs.deployment_id }}" \
            --expected-revision "${{ steps.previous_deployment.outputs.revision }}"
