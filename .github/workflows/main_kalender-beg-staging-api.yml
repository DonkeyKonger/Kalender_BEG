name: Build and deploy Python app to Azure Web App - staging API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tool_source_sha256: ${{ steps.verify-tool-import.outputs.source_sha256 }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          SECRET_KEY: test-secret-for-ci
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check app
          python -m pytest

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x "*.egg-info/*"

      - name: Verify tool import files in deployment package
        id: verify-tool-import
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          required_files = {
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx",
              "app/scripts/import_bundled_tools.py",
              "startup.sh",
          }
          with ZipFile("backend-release.zip") as archive:
              packaged_files = set(archive.namelist())
              missing = sorted(required_files - packaged_files)
              if missing:
                  raise SystemExit(
                      "Deployment-Paket enthält nicht alle Importdateien: "
                      + ", ".join(missing)
                  )
              with TemporaryDirectory() as temporary_directory:
                  app_root = Path(temporary_directory).resolve()
                  archive.extractall(app_root)
                  completed = subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "app.scripts.import_bundled_tools",
                          "--check-only",
                      ],
                      cwd=app_root,
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  verification = json.loads(completed.stdout)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_sha256={verification['sha256']}\n")
          print(json.dumps(verification, ensure_ascii=False, sort_keys=True))
          print(
              "Werkzeug-Importdatei liegt im Deployment-Paket unter "
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx und wird "
              "vom extrahierten App-Root gefunden."
          )
          PY

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend-release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile does not contain ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          publish_url = profile.attrib["publishUrl"].strip()
          if not publish_url.startswith(("http://", "https://")):
              publish_url = f"https://{publish_url}"
          publish_url = publish_url.rstrip("/")
          if not publish_url.endswith("/api/zipdeploy"):
              publish_url = f"{publish_url}/api/zipdeploy"

          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          subprocess.run(
              [
                  "curl",
                  "--fail",
                  "--show-error",
                  "--location",
                  "--request",
                  "POST",
                  "--user",
                  f"{username}:{password}",
                  "--header",
                  "Content-Type: application/zip",
                  "--data-binary",
                  "@backend-release.zip",
                  publish_url,
              ],
              check=True,
          )
          PY

      - name: Verify deployed application
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          EXPECTED_TOOL_SOURCE_SHA256: ${{ needs.build.outputs.tool_source_sha256 }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile does not contain ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          destination = profile.attrib.get("destinationAppUrl", "").rstrip("/")
          if not destination:
              raise SystemExit("Publish profile does not contain destinationAppUrl.")
          expected_sha256 = os.environ["EXPECTED_TOOL_SOURCE_SHA256"]
          health_url = f"{destination}/api/health"
          last_detail = "noch keine Antwort"
          for attempt in range(90):
              try:
                  with urllib.request.urlopen(health_url, timeout=15) as response:
                      health = json.load(response)
                  if response.status == 200 and health.get("status") == "ok":
                      print(json.dumps(health, ensure_ascii=False, sort_keys=True))
                      break
                  last_detail = json.dumps(health, ensure_ascii=False, sort_keys=True)
              except urllib.error.HTTPError as error:
                  last_detail = (
                      f"HTTP {error.code}: "
                      + error.read().decode(errors="replace")[-2000:]
                  )
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as error:
                  last_detail = str(error)
              if attempt == 89:
                  raise SystemExit(
                      "Die deployte Azure-App hat ihre Health-Prüfung nicht bestätigt. "
                      f"URL: {health_url}; letzte Antwort: {last_detail}"
                  )
              time.sleep(5)

          tool_health_url = f"{destination}/api/health/tool-import"
          tool_detail = "noch keine Antwort"
          tool_ready = False
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(tool_health_url, timeout=15) as response:
                      tool_health = json.load(response)
                  tool_detail = json.dumps(tool_health, ensure_ascii=False, sort_keys=True)
                  tool_ready = (
                      response.status == 200
                      and tool_health.get("status") == "ok"
                      and tool_health.get("source_sha256") == expected_sha256
                      and tool_health.get("imported_rows") == tool_health.get("expected_rows")
                  )
                  if tool_ready:
                      print(tool_detail)
                      break
              except urllib.error.HTTPError as error:
                  tool_detail = (
                      f"HTTP {error.code}: "
                      + error.read().decode(errors="replace")[-2000:]
                  )
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as error:
                  tool_detail = str(error)
              time.sleep(5)
          if not tool_ready:
              print(
                  "::warning::Werkzeugimport wurde nach dem Deploy noch nicht bestätigt. "
                  f"URL: {tool_health_url}; letzte Antwort: {tool_detail}"
              )
          PY
