name: Build and deploy Python app to Azure Web App - staging API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  workflow_dispatch:

concurrency:
  group: backend-staging-api-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tool_source_sha256: ${{ steps.verify-tool-import.outputs.source_sha256 }}
      previous_revision: ${{ steps.rollback-package.outputs.previous_revision }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          SECRET_KEY: test-secret-for-ci
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m pip install --upgrade pip
          python -m app.scripts.check_runtime_dependencies
          python -m pip install -r requirements.txt
          python -c "from app.main import app; assert app.title == 'Baustellenplaner API'"
          python -m pip install -e ".[dev]"
          python -m ruff check app
          python -m pytest

      - name: Create deployment package
        run: |
          printf '%s\n' "$GITHUB_SHA" > backend/app/build_sha.txt
          cd backend
          zip -r ../backend-release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x "*.egg-info/*"

      - name: Create rollback package from previous main revision
        id: rollback-package
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          from zipfile import ZipFile

          revision = (os.environ.get("PR_BASE_SHA") or os.environ.get("EVENT_BEFORE") or "").strip()
          if not re.fullmatch(r"[0-9a-f]{40}", revision) or revision == "0" * 40:
              revision = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"],
                  text=True,
              ).strip()
          subprocess.run(
              [
                  "git",
                  "archive",
                  "--format=zip",
                  "--output=backend-rollback.zip",
                  f"{revision}:backend",
              ],
              check=True,
          )
          with ZipFile("backend-rollback.zip", "a") as archive:
              archive.writestr("app/build_sha.txt", revision + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"previous_revision={revision}\n")
          print(f"Rollback package created from {revision}.")
          PY

      - name: Verify tool import files in deployment package
        id: verify-tool-import
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          required_files = {
              "app/build_sha.txt",
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx",
              "app/scripts/import_bundled_tools.py",
              "startup.sh",
          }
          for package_name in ("backend-release.zip", "backend-rollback.zip"):
              with ZipFile(package_name) as package:
                  packaged_files = set(package.namelist())
              missing = sorted(required_files - packaged_files)
              if missing:
                  raise SystemExit(
                      f"{package_name} enthält nicht alle Pflichtdateien: "
                      + ", ".join(missing)
                  )
          with ZipFile("backend-release.zip") as archive:
              with TemporaryDirectory() as temporary_directory:
                  app_root = Path(temporary_directory).resolve()
                  archive.extractall(app_root)
                  completed = subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "app.scripts.import_bundled_tools",
                          "--check-only",
                      ],
                      cwd=app_root,
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  verification = json.loads(completed.stdout)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_sha256={verification['sha256']}\n")
          print(json.dumps(verification, ensure_ascii=False, sort_keys=True))
          print(
              "Werkzeug-Importdatei liegt im Deployment-Paket unter "
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx und wird "
              "vom extrahierten App-Root gefunden."
          )
          PY

      - name: Upload artifact for deployment jobs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend-release.zip
            backend-rollback.zip

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Prepare deployment guard
        run: python -m zipfile -e backend-release.zip deployment-source

      - name: Deploy to Azure Web App
        id: deploy
        working-directory: deployment-source
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: python -m app.scripts.azure_deploy_guard deploy --package ../backend-release.zip

      - name: Verify deployed application
        working-directory: deployment-source
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python -m app.scripts.azure_deploy_guard verify \
            --expected-revision "${{ github.sha }}" \
            --expected-tool-source-sha256 "${{ needs.build.outputs.tool_source_sha256 }}"

      - name: Restore previous deployment after failed verification
        if: >-
          ${{ failure() && (steps.deploy.outcome == 'success' ||
              steps.deploy.outcome == 'failure') }}
        working-directory: deployment-source
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python -m app.scripts.azure_deploy_guard restore \
            --package ../backend-rollback.zip \
            --expected-revision "${{ needs.build.outputs.previous_revision }}"
