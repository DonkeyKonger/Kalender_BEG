name: Build and deploy Python app to Azure Web App - kalender-beg-staging-api

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          SECRET_KEY: test-secret-for-ci
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check app
          python -m pytest

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x "*.egg-info/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend-release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9505352247C4046A0B1A603037065F5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_70FB3E87FF944A05A5C397FE71A77FA3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_412CC59BD2A14E62883CA4D1F3803FA6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: kalender-beg-staging-api
          slot-name: Production
          package: backend-release.zip
