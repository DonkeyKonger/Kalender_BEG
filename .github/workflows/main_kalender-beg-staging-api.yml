name: Build and deploy Python app to Azure Web App - staging API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_kalender-beg-staging-api.yml"
  workflow_dispatch:
    inputs:
      import_tool_data:
        description: "Werkzeug-Datenstamm nach dem Deployment importieren"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tool_import_required: ${{ steps.tool-import-change.outputs.required }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect tool data snapshot change
        id: tool-import-change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_IMPORT: ${{ inputs.import_tool_data }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          required = os.environ.get("MANUAL_IMPORT", "false").lower() == "true"
          if os.environ.get("EVENT_NAME") == "push":
              before = os.environ.get("BEFORE_SHA", "")
              current = os.environ["CURRENT_SHA"]
              if before and set(before) != {"0"}:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, current],
                      text=True,
                  ).splitlines()
              else:
                  changed = subprocess.check_output(
                      ["git", "show", "--pretty=", "--name-only", current],
                      text=True,
                  ).splitlines()
              import_trigger_paths = {
                  ".github/workflows/main_kalender-beg-staging-api.yml",
                  "backend/app/import_data/BEG-Maschinen+Werkzeugliste.xlsx",
                  "backend/app/scripts/import_tools_from_excel.py",
                  "backend/app/scripts/run_deployed_tool_import.sh",
                  "backend/app/services/tool_material_excel_import.py",
              }
              required = required or bool(import_trigger_paths.intersection(changed))

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          print(f"Werkzeugimport nach Deployment: {'ja' if required else 'nein'}")
          PY

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          SECRET_KEY: test-secret-for-ci
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check app
          python -m pytest

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x "*.egg-info/*"

      - name: Verify tool import files in deployment package
        if: steps.tool-import-change.outputs.required == 'true'
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          required_files = {
              "app/import_data/BEG-Maschinen+Werkzeugliste.xlsx",
              "app/scripts/run_deployed_tool_import.sh",
          }
          with ZipFile("backend-release.zip") as archive:
              packaged_files = set(archive.namelist())
          missing = sorted(required_files - packaged_files)
          if missing:
              raise SystemExit(
                  "Deployment-Paket enthält nicht alle Importdateien: " + ", ".join(missing)
              )
          print("Werkzeug-Importdateien sind vollständig im Deployment-Paket enthalten.")
          PY

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend-release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile does not contain ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          publish_url = profile.attrib["publishUrl"].strip()
          if not publish_url.startswith(("http://", "https://")):
              publish_url = f"https://{publish_url}"
          publish_url = publish_url.rstrip("/")
          if not publish_url.endswith("/api/zipdeploy"):
              publish_url = f"{publish_url}/api/zipdeploy"

          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          subprocess.run(
              [
                  "curl",
                  "--fail",
                  "--show-error",
                  "--location",
                  "--request",
                  "POST",
                  "--user",
                  f"{username}:{password}",
                  "--header",
                  "Content-Type: application/zip",
                  "--data-binary",
                  "@backend-release.zip",
                  publish_url,
              ],
              check=True,
          )
          PY

      - name: Import verified tool master data
        if: needs.build.outputs.tool_import_required == 'true'
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profiles = root.findall("publishProfile")
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishMethod") == "MSDeploy"),
                  None,
              )
          if profile is None:
              raise SystemExit("Publish profile does not contain ZipDeploy/MSDeploy credentials.")

          username = profile.attrib["userName"]
          password = profile.attrib["userPWD"]
          destination = profile.attrib.get("destinationAppUrl", "").rstrip("/")
          if not destination:
              raise SystemExit("Publish profile does not contain destinationAppUrl.")
          publish_url = profile.attrib["publishUrl"].strip()
          if not publish_url.startswith(("http://", "https://")):
              publish_url = f"https://{publish_url}"
          scm_base = publish_url.rstrip("/")
          for suffix in ("/api/zipdeploy", "/api/msdeploy"):
              if scm_base.endswith(suffix):
                  scm_base = scm_base[: -len(suffix)]
          command_url = f"{scm_base}/api/command"
          release_sha = os.environ["GITHUB_SHA"]
          if len(release_sha) != 40 or any(character not in "0123456789abcdef" for character in release_sha):
              raise SystemExit("GITHUB_SHA is not a valid commit hash.")
          archive_path = f"/home/data/tool-import-{release_sha}.zip"
          release_root = f"/home/data/tool-material-import/releases/{release_sha}"
          import_script = f"{release_root}/app/scripts/run_deployed_tool_import.sh"

          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")

          health_url = f"{destination}/api/health"
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(health_url, timeout=15) as response:
                      health = json.load(response)
                  if response.status == 200 and health.get("status") == "ok":
                      break
              except (OSError, urllib.error.URLError, json.JSONDecodeError):
                  pass
              if attempt == 59:
                  raise SystemExit("Azure API did not become healthy before the tool import.")
              time.sleep(5)

          credentials = base64.b64encode(f"{username}:{password}".encode()).decode()

          # ZipDeploy can mount the application package directly for the running app.
          # That package is intentionally not visible through Kudu's wwwroot VFS. Upload
          # the already tested build artifact to persistent storage and execute the same
          # import helper from there instead of relying on the runtime mount.
          upload_url = f"{scm_base}/api/vfs/home/data/tool-import-{release_sha}.zip"
          with open("backend-release.zip", "rb") as deployment_package:
              upload_request = urllib.request.Request(
                  upload_url,
                  data=deployment_package.read(),
                  headers={
                      "Authorization": f"Basic {credentials}",
                      "Content-Type": "application/zip",
                      "If-Match": "*",
                  },
                  method="PUT",
              )
          try:
              with urllib.request.urlopen(upload_request, timeout=180) as response:
                  if response.status not in {200, 201, 204}:
                      raise SystemExit(
                          f"Azure import package upload returned HTTP {response.status}."
                      )
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")[-2000:]
              raise SystemExit(
                  f"Azure import package upload failed with HTTP {error.code}: {detail}"
              )

          request = urllib.request.Request(
              command_url,
              data=json.dumps(
                  {
                      "command": (
                          f"mkdir -p {release_root} && "
                          f"python -m zipfile -e {archive_path} {release_root} && "
                          f"PROJECT_ROOT={release_root} bash {import_script}"
                      ),
                      "dir": "/home/data",
                  }
              ).encode(),
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=900) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")[-2000:]
              raise SystemExit(f"Azure import command failed with HTTP {error.code}: {detail}")

          exit_code = result.get("ExitCode", result.get("exitCode", 1))
          output = result.get("Output", result.get("output", "")).strip()
          error_output = result.get("Error", result.get("error", "")).strip()
          if exit_code != 0:
              raise SystemExit(
                  f"Azure tool import exited with {exit_code}: "
                  f"{(error_output or output)[-2000:]}"
              )
          print(output or "Werkzeugimport erfolgreich abgeschlossen.")
          PY
