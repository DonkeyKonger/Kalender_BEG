[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baustellenplaner-backend"
version = "0.1.0"
description = "FastAPI backend for Baustellenplaner"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "fastapi>=0.115.0",
  "gunicorn>=23.0.0",
  "httpx>=0.27.2",
  "pdfplumber>=0.11.9",
  "bcrypt==4.0.1",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.3",
  "PyJWT>=2.10.1",
  "pydantic-settings>=2.5.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.setuptools.package-data]
app = ["assets/*.png"]
