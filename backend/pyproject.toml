[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baustellenplaner-backend"
version = "0.1.0"
description = "FastAPI backend for Baustellenplaner"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "fastapi>=0.115.0",
  "gunicorn>=23.0.0",
  "httpx>=0.27.2",
  "cryptography>=42.0.0",
  "pdfplumber>=0.11.9",
  "pandas>=2.2.3,<3",
  "openpyxl>=3.1.5",
  "xlsxwriter>=3.2.0",
  "matplotlib>=3.9.0",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0",
  "bcrypt==4.0.1",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.3",
  "PyJWT>=2.10.1",
  "pydantic-settings>=2.5.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "reportlab>=4.2.5",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Verbatim original parser, verified by SHA-256 and real-file parity tests.
# Its unused legacy helper contains an unresolved name; the exercised entrypoint
# is retained byte-for-byte at the user's request instead of being reformatted.
"app/services/price_comparison_pdf_parser.py" = ["E701", "E702", "F821", "F841"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.setuptools.package-data]
app = [
  "assets/*.png",
  "import_data/*.xlsx",
  "templates/extra_work/*.pdf",
  "templates/project_folders/*.pdf",
  "templates/time_entries/*.xlsx",
]
