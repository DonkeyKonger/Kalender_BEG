pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name 127.0.0.1 localhost;
        client_max_body_size 50m;
        location / {
            # Fixed destination, not a general-purpose forward proxy. Docker DNS
            # is re-resolved so restarting/rebuilding app never leaves a stale IP.
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $local_app http://app:8000;
            proxy_pass $local_app;
            proxy_set_header Host 127.0.0.1:18727;
            proxy_set_header X-Forwarded-For "";
            proxy_read_timeout 300s;
        }
    }
}
