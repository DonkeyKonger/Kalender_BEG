services:
  db:
    image: postgres:16-alpine
    container_name: baustellenplaner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baustellenplaner}
      POSTGRES_USER: ${POSTGRES_USER:-baustellenplaner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baustellenplaner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baustellenplaner} -d ${POSTGRES_DB:-baustellenplaner}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
